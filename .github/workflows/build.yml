name: Build and Release

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的标签（如 v1.0.1）时触发
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (never moves the tag)
        required: true
        default: v2.2.15

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download and verify official Electron runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./node_modules/electron/package.json').version"
          $asset = "electron-v$version-win32-x64.zip"
          $cache = Join-Path $env:RUNNER_TEMP "electron-$version"
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          gh release download "v$version" --repo electron/electron --pattern $asset --pattern SHASUMS256.txt --dir $cache
          if ($LASTEXITCODE -ne 0) { throw 'Official Electron download failed' }
          $line = Get-Content (Join-Path $cache 'SHASUMS256.txt') | Where-Object { $_ -match ('\s+\*?' + [regex]::Escape($asset) + '$') }
          if (@($line).Count -ne 1) { throw 'Missing or ambiguous official checksum' }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath (Join-Path $cache $asset) -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Electron SHA256 mismatch' }
          Expand-Archive -LiteralPath (Join-Path $cache $asset) -DestinationPath 'node_modules/electron/dist' -Force
          Set-Content -LiteralPath 'node_modules/electron/path.txt' -Value 'electron.exe' -NoNewline -Encoding ascii
          Set-Content -LiteralPath 'node_modules/electron/dist/version' -Value $version -NoNewline -Encoding ascii
          Write-Output "Verified official Electron $version SHA256: $actual"

      - name: Cache checksum-verified official NSIS tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = node -p "require('app-builder-lib/out/util/electronGet').getCacheDirectory({allowEnvVarOverride:true})"
          $tools = @(
            @{tag='nsis-3.0.4.1'; file='nsis-3.0.4.1.7z'; sha256='9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa'},
            @{tag='nsis-resources-3.4.1'; file='nsis-resources-3.4.1.7z'; sha256='593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103'}
          )
          foreach ($tool in $tools) {
            $dest = Join-Path $cache $tool.tag
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            gh release download $tool.tag --repo electron-userland/electron-builder-binaries --pattern $tool.file --dir $dest
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $($tool.file)" }
            $actual = (Get-FileHash -LiteralPath (Join-Path $dest $tool.file) -Algorithm SHA256).Hash
            if ($actual -ne $tool.sha256) { throw "Tool checksum mismatch: $($tool.file)" }
            Write-Output "Verified $($tool.file) SHA256: $actual"
          }

      - name: Verify release tag matches package version
        env:
          YT_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node -e "if(process.env.YT_RELEASE_TAG !== 'v'+require('./package.json').version)process.exit(1)"

      - name: Regression tests
        run: npm test

      - name: Electron UI and isolation tests
        run: npm run test:electron

      - name: Tray and lifecycle entrypoint tests
        run: npm run test:lifecycle

      - name: Real Chrome process ownership and crash cleanup
        run: npm run test:guard

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          EP_DRAFT: 'true'
        run: npm run dist -- --publish always

      - name: Verify the exact draft installer payload
        run: |
          $product = node -p "require('./package.json').productName"
          $version = node -p "require('./package.json').version"
          npm run test:packaged -- "dist/$product Setup $version.exe"
